[workspace]
resolver = "2"
members = [
    "crates/core",
    "crates/crypto",
    "crates/consensus",
    "crates/mempool",
    "crates/state",
    "crates/storage",
    "crates/executor",
    "crates/api",
    "crates/node",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
authors = ["Gold Stablecoin Team"]

[workspace.dependencies]
# Async runtime
tokio = { version = "1.35", features = ["full"] }

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Cryptography
ed25519-dalek = { version = "2.1", features = ["rand_core", "batch"] }
sha2 = "0.10"
rand = "0.8"
hex = "0.4"

# Concurrent data structures
dashmap = "5.5"
parking_lot = "0.12"

# Parallel processing
rayon = "1.8"

# Web framework
axum = { version = "0.7", features = ["ws"] }
axum-extra = { version = "0.9", features = ["typed-header"] }
tower = "0.4"
tower-http = { version = "0.5", features = ["cors", "trace"] }

# Database
rocksdb = "0.22"

# Logging and tracing
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Time
chrono = { version = "0.4", features = ["serde"] }

# Error handling
thiserror = "1.0"
anyhow = "1.0"

# UUID
uuid = { version = "1.6", features = ["v4", "serde"] }

# Futures
futures = "0.3"

# Testing
criterion = "0.5"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
